{% comment %}
  Стек карточек «вам звонили» за сегодня. Грузится при открытии страницы —
  чтобы напоминание переживало обновление браузера.
{% endcomment %}
{% for alert in alerts %}
  {% include "telephony/partials/_call_alert.html" %}
{% endfor %}
{% if alerts|length > 1 %}
  <div class="text-right" data-call-alerts-clear>
    <button class="btn btn-ghost btn-xs"
            hx-post="{% url 'telephony:alerts_dismiss_all' %}"
            hx-target="#incoming-calls" hx-swap="innerHTML">
      убрать все ({{ alerts|length }})
    </button>
  </div>
{% endif %}
