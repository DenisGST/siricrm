<dialog id="cc-result-form-modal" class="modal modal-middle modal-open">
  <div class="modal-box w-full max-w-md">
    <h3 class="font-bold text-lg mb-4">
      {% if result %}Результат: {{ result.name }}{% else %}Новый результат{% endif %}
    </h3>
    <form hx-post="{% if result %}{% url 'callcenter:admin_result_edit' result.pk %}{% else %}{% url 'callcenter:admin_result_add' %}{% endif %}"
          hx-target="#cc-result-form-modal" hx-swap="outerHTML" class="space-y-3">
      {% csrf_token %}
      <div>
        <label class="label"><span class="label-text">Название</span></label>
        <input type="text" name="name" value="{{ form.name.value|default:'' }}"
               class="input input-bordered w-full input-sm" required autofocus>
      </div>
      <div>
        <label class="label"><span class="label-text">Подсказка оператору</span></label>
        <input type="text" name="hint" value="{{ form.hint.value|default:'' }}"
               class="input input-bordered w-full input-sm"
               placeholder="Когда выбирать этот результат">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="label"><span class="label-text">Цвет</span></label>
          <select name="color" class="select select-bordered select-sm w-full">
            {% for value, label in form.fields.color.choices %}
              <option value="{{ value }}" {% if form.color.value == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="label"><span class="label-text">Порядок</span></label>
          <input type="number" name="order" value="{{ form.order.value|default:'' }}" min="0"
                 class="input input-bordered w-full input-sm" placeholder="в конец">
        </div>
      </div>
      <div class="flex gap-6">
        <label class="label cursor-pointer gap-2">
          <input type="checkbox" name="suggest_next_action"
                 {% if form.suggest_next_action.value %}checked{% endif %}
                 class="checkbox checkbox-primary checkbox-sm">
          <span class="label-text">Предлагать запланировать действие</span>
        </label>
        <label class="label cursor-pointer gap-2">
          <input type="checkbox" name="is_active" {% if form.is_active.value %}checked{% endif %}
                 class="checkbox checkbox-primary checkbox-sm">
          <span class="label-text">Активен</span>
        </label>
      </div>
      {% if form.errors %}<div class="alert alert-error text-sm">{{ form.errors }}</div>{% endif %}
      <div class="modal-action">
        <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
        <button type="button" class="btn btn-sm" onclick="this.closest('dialog').remove()">Отмена</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button onclick="this.closest('dialog').remove()">close</button>
  </form>
</dialog>
